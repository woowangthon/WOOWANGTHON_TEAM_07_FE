<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FFFFFF" />
  <title>엘리베이터 지하철</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <!-- 아이콘: Material Symbols Rounded, 쓰는 아이콘만 불러온다 (REQ-DS-007). display=block: 글꼴이 오기 전 아이콘 이름 글자를 숨긴다 -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,600,0..1,0&icon_names=accessible,add,alt_route,arrow_upward,battery_full,build,cancel,check,check_circle,chevron_right,close,delete,door_front,edit,elevator,error,expand_more,fit_screen,flag,format_size,fullscreen,fullscreen_exit,help,home,info,lightbulb,list_alt,logout,map,person,play_arrow,remove,restart_alt,schedule,search,settings,signal_cellular_alt,smart_toy,star,star_border,subway,swap_vert,sync_alt,warning,wifi,work&display=block" />
  <!-- 디자인은 Prototype-v2의 CSS를 그대로 쓴다(디자인 보존). -->
  <link rel="stylesheet" href="/legacy/css/style.css" />
  <link rel="stylesheet" href="/legacy/css/map.css" />
  <link rel="stylesheet" href="/legacy/css/departure-graphic.css" />
  <link rel="stylesheet" href="/legacy/css/accessible-routes.css" />
  <style>#root { display: contents; }</style>
  <!-- 글자 크기 설정 즉시 적용 (FOUC 방지). 로그인과 무관한 접근성 설정. -->
  <script>try { var _fs = localStorage.getItem('elevSubway.fontSize.v1'); if (_fs && _fs !== 'normal') document.documentElement.setAttribute('data-fontsize', _fs); } catch(e){}</script>
</head>
<body>
  <div id="root"></div>
  <!-- 환경 설정. 모든 서비스 스크립트보다 먼저 정의한다. API 키·Secret은 여기에 넣지 않는다.
       값은 Vite 환경 변수(VITE_DATA_SOURCE=api|mock, VITE_BE_BASE, VITE_CHAT_BASE, VITE_AUTH_MODE, VITE_API_BASE)에서 온다. -->
  <script>
    window.APP_CONFIG = {
      authMode: '%VITE_AUTH_MODE%', apiBase: '%VITE_API_BASE%',
      dataSource: '%VITE_DATA_SOURCE%', beBase: '%VITE_BE_BASE%', chatBase: '%VITE_CHAT_BASE%'
    };
  </script>
  <!-- 서비스 모듈은 Prototype-v2 원본을 일반 스크립트로 불러온다(같은 순서). app.js 대신 React가 화면을 그린다. -->
  <script src="/legacy/js/mock-data.js"></script>
  <script src="/legacy/js/api-client.js"></script>
  <script src="/legacy/js/station-id-map.js"></script>
  <script src="/legacy/js/elevator-service.js"></script>
  <script src="/legacy/js/time-calculator.js"></script>
  <script src="/legacy/js/metro-map.js"></script>
  <script src="/legacy/js/departure-graphic.js"></script>
  <script src="/legacy/js/accessible-routes.js"></script>
  <script src="/legacy/js/accessible-route-view.js"></script>
  <script src="/legacy/js/accessible-route-expiry.js"></script>
  <script src="/legacy/js/ai-agent.js"></script>
  <script src="/legacy/js/auth.js"></script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
