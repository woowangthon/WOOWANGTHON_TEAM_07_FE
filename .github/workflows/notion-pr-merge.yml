
name: Complete Notion Tasks on PR Merge

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: read

jobs:
  complete-tasks:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Complete linked Notion Tasks
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_TASKS_DATA_SOURCE_ID: ${{ secrets.NOTION_TASKS_DATA_SOURCE_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          cat > /tmp/complete_tasks.py <<'PY'
          import os
          import re
          import json
          import time
          import urllib.request
          import urllib.error

          token = os.environ["NOTION_TOKEN"]
          source_id = os.environ["NOTION_TASKS_DATA_SOURCE_ID"]
          github_token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          pr_number = os.environ["PR_NUMBER"]

          notion_headers = {
              "Authorization": f"Bearer {token}",
              "Notion-Version": "2025-09-03",
              "Content-Type": "application/json"
          }

          github_headers = {
              "Authorization": f"Bearer {github_token}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "notion-pr-merge-sync"
          }

          def api_request(
              url, method="GET", data=None, headers=None
          ):
              payload = (
                  json.dumps(
                      data, ensure_ascii=False
                  ).encode("utf-8")
                  if data is not None else None
              )

              req = urllib.request.Request(
                  url,
                  data=payload,
                  headers=headers or {},
                  method=method
              )

              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(
                          req, timeout=30
                      ) as response:
                          return json.load(response)

                  except urllib.error.HTTPError as exc:
                      error = exc.read().decode(
                          "utf-8", errors="replace"
                      )

                      if exc.code in (429, 500, 502, 503, 504):
                          if attempt < 2:
                              time.sleep(2 ** (attempt + 1))
                              continue

                      print(
                          f"API error {exc.code}: "
                          f"{error[:1200]}"
                      )
                      raise

              raise RuntimeError("API request failed")

          # Get the merged PR from GitHub.
          pr = api_request(
              f"https://api.github.com/repos/{repo}"
              f"/pulls/{pr_number}",
              headers=github_headers
          )

          if not pr.get("merged"):
              print("PR was not merged. Skipping.")
              raise SystemExit(0)

          if pr["base"]["ref"] != "main":
              print("PR was not merged into main.")
              raise SystemExit(0)

          pr_body = pr.get("body") or ""

          # Match closing references in PR description.
          # Examples: Closes #12, Fixes #13, Resolves #14
          pattern = (
              r"\b(?:close|closes|closed|fix|fixes|fixed|"
              r"resolve|resolves|resolved)"
              r"\s+#(\d+)\b"
          )

          issue_numbers = sorted({
              int(number)
              for number in re.findall(
                  pattern,
                  pr_body,
                  flags=re.IGNORECASE
              )
          })

          if not issue_numbers:
              print(
                  "No closing issue references "
                  "found in PR description."
              )
              raise SystemExit(0)

          print(f"Linked issues: {issue_numbers}")

          def find_tasks(issue_url):
              result = api_request(
                  f"https://api.notion.com/v1/"
                  f"data_sources/{source_id}/query",
                  method="POST",
                  headers=notion_headers,
                  data={
                      "filter": {
                          "property": "Github Issue",
                          "url": {"equals": issue_url}
                      },
                      "page_size": 100
                  }
              )

              if result.get("has_more"):
                  raise RuntimeError(
                      "More than 100 matching tasks. "
                      "Pagination required."
                  )

              return result.get("results", [])

          def complete_task(task):
              page_id = task["id"]

              api_request(
                  f"https://api.notion.com/v1/pages/{page_id}",
                  method="PATCH",
                  headers=notion_headers,
                  data={
                      "properties": {
                          "상태": {
                              "status": {"name": "Done"}
                          },
                          "Completed": {
                              "checkbox": True
                          }
                      }
                  }
              )

              print(f"Completed Notion Task: {page_id}")

          completed_count = 0
          missing_count = 0

          for number in issue_numbers:
              issue_url = (
                  f"https://github.com/{repo}/issues/{number}"
              )

              tasks = find_tasks(issue_url)

              if not tasks:
                  print(
                      f"No Notion Task found "
                      f"for Issue #{number}"
                  )
                  missing_count += 1
                  continue

              for task in tasks:
                  complete_task(task)
                  completed_count += 1

          print(
              f"Finished: {completed_count} tasks completed, "
              f"{missing_count} issue references not found."
          )
          PY

          python /tmp/complete_tasks.py
