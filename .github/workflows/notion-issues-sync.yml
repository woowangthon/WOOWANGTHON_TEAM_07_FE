
name: Sync GitHub Issues to Notion Tasks

on:
  issues:
    types: [opened, edited, labeled, unlabeled]

permissions:
  contents: read
  issues: read

concurrency:
  group: notion-issue-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  sync-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Sync Issue to Notion Tasks
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_TASKS_DATA_SOURCE_ID: ${{ secrets.NOTION_TASKS_DATA_SOURCE_ID }}
          ISSUE_JSON: ${{ toJSON(github.event.issue) }}
          ISSUE_ACTION: ${{ github.event.action }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cat > /tmp/sync_issue.py <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          token = os.environ["NOTION_TOKEN"]
          source_id = os.environ["NOTION_TASKS_DATA_SOURCE_ID"]
          issue = json.loads(os.environ["ISSUE_JSON"])
          action = os.environ["ISSUE_ACTION"]
          repo = os.environ["GITHUB_REPOSITORY"]

          title = issue["title"]
          description = issue.get("body") or ""
          issue_url = issue["html_url"]

          stack = repo.rsplit("_", 1)[-1].upper()
          if stack not in ("FE", "BE", "AI"):
              raise ValueError(f"Invalid stack: {stack}")

          # GitHub labels -> Notion task type
          labels = {
              label["name"].strip().lower()
              for label in issue.get("labels", [])
          }

          if "bug" in labels:
              task_type = "Bug"
          elif "feature" in labels:
              task_type = "Feature"
          elif "docs" in labels:
              task_type = "Docs"
          else:
              task_type = "Task"

          headers = {
              "Authorization": f"Bearer {token}",
              "Notion-Version": "2025-09-03",
              "Content-Type": "application/json"
          }

          def notion_request(url, method="GET", data=None):
              payload = (
                  json.dumps(data, ensure_ascii=False).encode("utf-8")
                  if data is not None else None
              )

              req = urllib.request.Request(
                  url,
                  data=payload,
                  headers=headers,
                  method=method
              )

              try:
                  with urllib.request.urlopen(req, timeout=30) as res:
                      return json.load(res)
              except urllib.error.HTTPError as exc:
                  error = exc.read().decode("utf-8")
                  print(f"Notion API error {exc.code}: {error[:1200]}")
                  raise

          def rich_text(value):
              value = str(value or "")
              return [
                  {
                      "type": "text",
                      "text": {"content": value[i:i + 1800]}
                  }
                  for i in range(0, len(value), 1800)
              ][:100]

          def find_task():
              result = notion_request(
                  f"https://api.notion.com/v1/data_sources/{source_id}/query",
                  "POST",
                  {
                      "filter": {
                          "property": "Github Issue",
                          "url": {"equals": issue_url}
                      },
                      "page_size": 1
                  }
              )
              results = result.get("results", [])
              return results[0] if results else None

          properties = {
              "업무명": {
                  "title": rich_text(title)
              },
              "Description": {
                  "rich_text": rich_text(description)
              },
              "Github Issue": {
                  "url": issue_url
              },
              "담당 분야": {
                  "select": {"name": stack}
              },
              "업무 유형": {
                  "select": {"name": task_type}
              }
          }

          task = find_task()

          if task:
              notion_request(
                  f"https://api.notion.com/v1/pages/{task['id']}",
                  "PATCH",
                  {"properties": properties}
              )
              print(f"Updated task: {issue_url} [{task_type}]")

          elif action == "opened":
              properties["상태"] = {
                  "status": {"name": "Not started"}
              }

              result = notion_request(
                  "https://api.notion.com/v1/pages",
                  "POST",
                  {
                      "parent": {
                          "type": "data_source_id",
                          "data_source_id": source_id
                      },
                      "properties": properties
                  }
              )
              print(f"Created task: {result['id']} [{task_type}]")

          else:
              print("Matching task not found. No changes made.")
          PY

          python /tmp/sync_issue.py
