<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FFFFFF" />
  <title>엘리베이터 지하철</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/map.css" />
  <!-- 글자 크기 설정 즉시 적용 (FOUC 방지). 로그인과 무관한 접근성 설정. -->
  <script>try { var _fs = localStorage.getItem('elevSubway.fontSize.v1'); if (_fs && _fs !== 'normal') document.documentElement.setAttribute('data-fontsize', _fs); } catch(e){}</script>
</head>
<body>
  <div class="desktop-stage">
    <!-- 데스크톱 전용 시연 제어판 -->
    <aside id="demoPanel" class="demo-panel">
      <div class="demo-brand">
        <div class="demo-logo">🛗</div>
        <div>
          <div class="demo-title">엘리베이터 지하철</div>
          <div class="demo-sub">우왕톤 7팀 · 프로토타입 v0.2</div>
        </div>
      </div>
      <div class="demo-section">
        <div class="section-label">시연 시나리오</div>
        <div id="demoScenarioList" class="demo-list"></div>
      </div>
      <div class="demo-section" id="demoStationSection">
        <div class="section-label">선택한 역</div>
        <p id="demoStationName" class="demo-station-name">지도에서 역을 선택하세요</p>
        <div id="demoStationControls" class="demo-station-controls" hidden>
          <div class="demo-station-buttons">
            <button id="demoStationBreak" class="btn btn-danger btn-block" type="button">이 역 전체 고장</button>
            <button id="demoStationRestore" class="btn btn-ghost btn-block" type="button">이 역 전체 복구</button>
          </div>
          <div id="demoElevList" class="demo-elev-list"></div>
        </div>
      </div>
      <div class="demo-section">
        <button id="demoReset" class="btn btn-ghost btn-block" type="button">↺ 전체 상태 초기화</button>
        <button id="fullscreenToggle" class="btn btn-ghost btn-block" type="button">⛶ 전체화면 모드</button>
      </div>
      <p class="demo-hint muted">노선도에서 역을 누르거나, AI 챗봇에 "강남역 엘리베이터 돼?"라고 물어보세요.</p>
    </aside>

    <!-- 모바일 폰 프레임 -->
    <div id="phone" class="phone">
      <div class="status-bar">
        <span id="statusTime">9:41</span>
        <span class="status-icons">▂▄▆ 📶 🔋</span>
      </div>

      <header class="app-header">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input id="searchInput" type="search" placeholder="역 이름 검색 (예: 강남)" autocomplete="off" />
          <button id="demoBtn" class="icon-btn" type="button" aria-label="시연 제어판">⚙️</button>
        </div>
        <div id="searchResults" class="search-results"></div>
      </header>

      <main class="views">
        <!-- 노선도 -->
        <section id="view-map" class="view active" data-view="map">
          <div id="lineFilter" class="line-filter"></div>
          <div id="mapContainer" class="map-container"></div>
          <div class="map-controls">
            <button id="zoomIn" class="icon-btn" type="button" aria-label="확대">＋</button>
            <button id="zoomOut" class="icon-btn" type="button" aria-label="축소">－</button>
            <button id="zoomReset" class="icon-btn" type="button" aria-label="전체 보기">⤢</button>
          </div>
          <div class="map-legend">
            <span><i class="dot ok"></i>정상</span>
            <span><i class="dot warn"></i>일부 불가</span>
            <span><i class="dot bad"></i>이용 불가</span>
          </div>
        </section>

        <!-- 엘리베이터 -->
        <section id="view-elevator" class="view" data-view="elevator">
          <div class="view-scroll">
            <h2 class="view-title">엘리베이터 현황</h2>
            <div id="elevatorSummary" class="summary-grid"></div>
            <div id="elevatorFilter" class="chip-row"></div>
            <div id="elevatorList" class="station-list"></div>
          </div>
        </section>

        <!-- 출발 시각 계산 -->
        <section id="view-time" class="view" data-view="time">
          <div class="view-scroll">
            <h2 class="view-title">출발 시각 계산</h2>
            <form id="timeForm" class="card time-form">
              <div class="form-row station-pair">
                <div class="form-field">
                  <label class="form-label" for="originSearch">출발역</label>
                  <div class="station-combo" id="originCombo">
                    <input id="originSearch" type="search" class="station-combo-input"
                           placeholder="역 이름 검색" autocomplete="off" role="combobox"
                           aria-expanded="false" aria-controls="originResults" aria-autocomplete="list" />
                    <div id="originResults" class="station-combo-results" role="listbox" hidden></div>
                    <input id="originValue" type="hidden" />
                  </div>
                </div>
                <button id="swapBtn" class="icon-btn swap-btn" type="button" aria-label="출발/도착 바꾸기">⇄</button>
                <div class="form-field">
                  <label class="form-label" for="destSearch">도착역</label>
                  <div class="station-combo" id="destCombo">
                    <input id="destSearch" type="search" class="station-combo-input"
                           placeholder="역 이름 검색" autocomplete="off" role="combobox"
                           aria-expanded="false" aria-controls="destResults" aria-autocomplete="list" />
                    <div id="destResults" class="station-combo-results" role="listbox" hidden></div>
                    <input id="destValue" type="hidden" />
                  </div>
                </div>
              </div>
              <div class="form-row time-options-row">
                <div class="form-field">
                  <label class="form-label" for="arriveBy">도착 희망 시각</label>
                  <input id="arriveBy" type="time" value="15:00" />
                </div>
                <label class="switch">
                  <input id="modeNow" type="checkbox" />
                  <span>지금 바로 출발</span>
                </label>
              </div>
              <button class="btn btn-primary btn-block" type="submit">출발 시각 계산하기</button>
            </form>
            <div id="timeResult"></div>
          </div>
        </section>

        <!-- AI 챗봇 -->
        <section id="view-chat" class="view" data-view="chat">
          <div id="chatMessages" class="chat-messages"></div>
          <div class="chat-composer">
            <div id="chatSuggestions" class="chip-row chat-suggestions" hidden></div>
            <form id="chatForm" class="chat-form">
              <input id="chatInput" type="text" placeholder="예) 강남역 엘리베이터 돼?" autocomplete="off" />
              <button class="btn btn-primary" type="submit" aria-label="보내기">↑</button>
            </form>
          </div>
        </section>

        <!-- 로그인 / 마이페이지 -->
        <section id="view-login" class="view" data-view="login">
          <div class="view-scroll">

            <!-- ① 비로그인 상태 -->
            <div id="authGuest" class="auth-state" hidden>
              <h2 class="view-title">로그인</h2>
              <div class="card auth-card">
                <p class="card-title">계정으로 시작하기</p>
                <p class="card-sub">집·회사 위치와 즐겨찾기를 저장할 수 있습니다.</p>
                <div class="auth-buttons">
                  <button class="auth-btn auth-google" type="button" data-provider="google">
                    <span class="auth-btn-logo auth-google-logo" aria-hidden="true">G</span>
                    Google로 시작하기
                  </button>
                  <button class="auth-btn auth-kakao" type="button" data-provider="kakao">
                    <span class="auth-btn-logo auth-kakao-logo" aria-hidden="true">K</span>
                    카카오로 시작하기
                  </button>
                </div>
              </div>
            </div>

            <!-- ② 로그인됨: 마이페이지 -->
            <div id="authUser" class="auth-state" hidden>
              <h2 class="view-title">마이페이지</h2>

              <!-- 프로필 -->
              <div class="card auth-card auth-profile-card">
                <div class="auth-profile">
                  <div id="authProfileAvatar" class="auth-avatar" aria-hidden="true">G</div>
                  <div class="auth-profile-info">
                    <div class="auth-profile-name-row">
                      <p id="authProfileName" class="auth-profile-name">게스트 사용자</p>
                      <div id="nameEditRow" class="name-edit-row" hidden>
                        <input id="nameEditInput" type="text" class="name-edit-input" autocomplete="off" maxlength="30" aria-label="사용자 이름" />
                        <button id="nameEditConfirm" class="btn btn-sm btn-primary" type="button">저장</button>
                        <button id="nameEditCancel" class="btn btn-sm btn-ghost" type="button">취소</button>
                      </div>
                      <button id="editNameBtn" class="btn btn-sm btn-ghost" type="button" aria-label="이름 편집">편집</button>
                    </div>
                    <p class="auth-provider-sub">
                      <span id="authProviderBadge" class="auth-provider-badge"></span>
                      <span>계정으로 로그인됨</span>
                    </p>
                  </div>
                </div>
              </div>

              <!-- 즐겨찾기 장소 -->
              <div id="favSection" class="card mypage-section">
                <div class="mypage-section-header">
                  <span class="mypage-section-icon" aria-hidden="true">⭐</span>
                  <span class="mypage-section-title">즐겨찾기 장소</span>
                  <div class="fav-header-actions">
                    <button id="favAddBtn" class="btn btn-sm btn-ghost" type="button">＋ 추가</button>
                    <button id="favEditBtn" class="btn btn-sm btn-ghost" type="button">수정</button>
                  </div>
                </div>
                <!-- 추가 입력 행 (기본 숨김) -->
                <div id="favAddRow" class="fav-add-row" hidden>
                  <input id="favAddInput" type="text" class="fav-rename-input" placeholder="장소 이름 입력" autocomplete="off" maxlength="20" />
                  <button id="favAddConfirm" class="btn btn-sm btn-primary" type="button">저장</button>
                  <button id="favAddCancel" class="btn btn-sm btn-ghost" type="button">취소</button>
                </div>
                <ul id="favList" class="fav-list"></ul>
                <p id="favEmptyMsg" class="mypage-empty-hint">즐겨찾기한 장소가 없습니다.</p>
              </div>

              <!-- 글자 크기 설정 -->
              <div class="card mypage-section">
                <div class="mypage-section-header">
                  <span class="mypage-section-icon" aria-hidden="true">🔤</span>
                  <span class="mypage-section-title">글자 크기</span>
                </div>
                <div class="fontsize-chips">
                  <button class="fontsize-chip" type="button" data-fontsize="normal">보통</button>
                  <button class="fontsize-chip" type="button" data-fontsize="lg">크게</button>
                  <button class="fontsize-chip" type="button" data-fontsize="xl">아주 크게</button>
                  <button class="fontsize-chip" type="button" data-fontsize="max">최대</button>
                </div>
              </div>

              <!-- 로그아웃 -->
              <button class="btn btn-ghost btn-block auth-signout-btn" type="button" data-auth="signout">로그아웃</button>
            </div>

            <!-- ③ 세션 확인 중 (real 모드 초기) -->
            <div id="authLoading" class="auth-loading" hidden>
              <span class="auth-loading-dot"></span>
            </div>

          </div>
        </section>
      </main>

      <!-- 바텀 시트 -->
      <div id="sheetBackdrop" class="sheet-backdrop"></div>
      <div id="bottomSheet" class="bottom-sheet" role="dialog" aria-modal="true">
        <div class="sheet-handle"></div>
        <div id="sheetContent" class="sheet-content"></div>
      </div>

      <!-- 하단 탭 -->
      <nav class="tab-bar">
        <button class="tab active" data-tab="map" type="button"><span class="tab-icon">🗺️</span><span>노선도</span></button>
        <button class="tab" data-tab="elevator" type="button"><span class="tab-icon">🛗</span><span>엘리베이터</span></button>
        <button class="tab" data-tab="time" type="button"><span class="tab-icon">⏱️</span><span>출발계산</span></button>
        <button class="tab" data-tab="chat" type="button"><span class="tab-icon">🤖</span><span>AI 챗봇</span></button>
        <button class="tab" data-tab="login" type="button"><span class="tab-icon">👤</span><span>로그인</span></button>
      </nav>

      <div id="toast" class="toast"></div>
    </div>
  </div>

  <script src="js/mock-data.js"></script>
  <script src="js/elevator-service.js"></script>
  <script src="js/time-calculator.js"></script>
  <script src="js/metro-map.js"></script>
  <script src="js/ai-agent.js"></script>
  <!-- 환경별 API 주소 설정.
       로컬 개발: window.APP_CONFIG = { apiBase: 'http://localhost:8000' };
       배포:      window.APP_CONFIG = { apiBase: 'https://api.example.com' };
       같은 오리진(기본값): apiBase를 '' 으로 두면 된다. API 키·Secret은 여기에 넣지 않는다. -->
  <script>
    /* 환경 설정. API 키·OAuth Secret은 여기에 넣지 않는다.
     * authMode: 'demo'  — 데모 로그인 (기본값, 프로토타입용)
     *           'real'  — FastAPI 백엔드 연동 (배포 시 변경)
     * apiBase:  ''      — 같은 오리진 (기본값)
     *           'http://localhost:8000' 등으로 변경 가능 */
    window.APP_CONFIG = { authMode: 'demo', apiBase: '' };
  </script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
