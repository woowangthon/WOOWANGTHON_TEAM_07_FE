<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FFFFFF" />
  <title>엘리베이터 지하철</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <!-- 아이콘: Material Symbols Rounded, 쓰는 아이콘만 불러온다 (REQ-DS-007). display=block: 글꼴이 오기 전 아이콘 이름 글자를 숨긴다 -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,600,0..1,0&icon_names=accessible,add,alt_route,arrow_upward,battery_full,build,cancel,check,check_circle,chevron_right,door_front,elevator,error,expand_more,fit_screen,flag,fullscreen,fullscreen_exit,help,info,lightbulb,list_alt,map,remove,restart_alt,schedule,search,settings,signal_cellular_alt,smart_toy,subway,swap_vert,sync_alt,warning,wifi&display=block" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/map.css" />
</head>
<body>
  <div class="desktop-stage">
    <!-- 데스크톱 전용 시연 제어판 -->
    <aside id="demoPanel" class="demo-panel">
      <div class="demo-brand">
        <div class="demo-logo"><span class="ms ms-lg" aria-hidden="true">elevator</span></div>
        <div>
          <div class="demo-title">엘리베이터 지하철</div>
          <div class="demo-sub">우왕톤 7팀 · 프로토타입 v0.2</div>
        </div>
      </div>
      <div class="demo-section">
        <div class="section-label">시연 시나리오</div>
        <div id="demoScenarioList" class="demo-list"></div>
      </div>
      <div id="demoStation" class="demo-section"></div>
      <div class="demo-section">
        <button id="demoReset" class="btn btn-ghost btn-block" type="button"><span class="ms" aria-hidden="true">restart_alt</span>전체 상태 초기화</button>
        <button id="fullscreenToggle" class="btn btn-ghost btn-block" type="button"><span class="ms" aria-hidden="true">fullscreen</span>전체화면 모드</button>
      </div>
      <p class="demo-hint muted">노선도에서 역을 누르거나, AI 챗봇에 "강남역 엘리베이터 돼?"라고 물어보세요.</p>
    </aside>

    <!-- 모바일 폰 프레임 -->
    <div id="phone" class="phone">
      <div class="status-bar">
        <span id="statusTime">9:41</span>
        <span class="status-icons" aria-hidden="true"><span class="ms">signal_cellular_alt</span><span class="ms">wifi</span><span class="ms">battery_full</span></span>
      </div>

      <header class="app-header">
        <div class="search-box">
          <span class="search-icon ms" aria-hidden="true">search</span>
          <input id="searchInput" type="search" placeholder="역 이름 검색 (예: 강남)" autocomplete="off" />
          <button id="demoBtn" class="icon-btn" type="button" aria-label="시연 제어판"><span class="ms ms-lg" aria-hidden="true">settings</span></button>
        </div>
        <div id="searchResults" class="search-results"></div>
      </header>

      <main class="views">
        <!-- 노선도 -->
        <section id="view-map" class="view active" data-view="map">
          <div id="lineFilter" class="line-filter"></div>
          <div id="mapContainer" class="map-container"></div>
          <div class="map-controls">
            <button id="zoomIn" class="icon-btn" type="button" aria-label="확대"><span class="ms ms-lg" aria-hidden="true">add</span></button>
            <button id="zoomOut" class="icon-btn" type="button" aria-label="축소"><span class="ms ms-lg" aria-hidden="true">remove</span></button>
            <button id="zoomReset" class="icon-btn" type="button" aria-label="전체 보기"><span class="ms ms-lg" aria-hidden="true">fit_screen</span></button>
          </div>
          <div class="map-legend">
            <span><i class="lg-node ok"></i>정상</span>
            <span><i class="lg-node warn"><span class="ms" aria-hidden="true">error</span></i>일부 운행</span>
            <span><i class="lg-node bad"><span class="ms" aria-hidden="true">cancel</span></i>이용 불가</span>
            <span><i class="lg-node unknown"></i>정보 없음</span>
          </div>
        </section>

        <!-- 엘리베이터 -->
        <section id="view-elevator" class="view" data-view="elevator">
          <div class="view-scroll">
            <h2 class="view-title">엘리베이터 현황</h2>
            <div id="elevatorSummary" class="summary-grid"></div>
            <div id="elevatorFilter" class="chip-row"></div>
            <div id="elevatorList" class="station-list"></div>
          </div>
        </section>

        <!-- 출발 시각 계산 -->
        <section id="view-time" class="view" data-view="time">
          <div class="view-scroll">
            <h2 class="view-title">출발 시각 계산</h2>
            <form id="timeForm" class="card time-form">
              <div class="form-row">
                <div class="form-field">
                  <label class="form-label" for="originSelect">출발역</label>
                  <select id="originSelect"></select>
                </div>
                <button id="swapBtn" class="icon-btn swap-btn" type="button" aria-label="출발/도착 바꾸기"><span class="ms ms-lg" aria-hidden="true">swap_vert</span></button>
                <div class="form-field">
                  <label class="form-label" for="destSelect">도착역</label>
                  <select id="destSelect"></select>
                </div>
              </div>
              <div class="form-row time-row">
                <div class="form-field">
                  <span id="arriveByLabel" class="form-label">도착 희망 시각</span>
                  <div class="time-picker" role="group" aria-labelledby="arriveByLabel">
                    <select id="arriveAmpm" aria-label="오전 오후"><option value="오전">오전</option><option value="오후">오후</option></select>
                    <select id="arriveHour" aria-label="시"></select>
                    <span class="time-picker-sep" aria-hidden="true">:</span>
                    <select id="arriveMin" aria-label="분"></select>
                  </div>
                  <input id="arriveBy" type="hidden" value="15:00" />
                </div>
                <label class="switch">
                  <input id="modeNow" type="checkbox" />
                  <span>지금 바로 출발</span>
                </label>
              </div>
              <button class="btn btn-primary btn-block btn-main" type="submit">출발 시각 계산하기</button>
            </form>
            <div id="timeResult"></div>
          </div>
        </section>

        <!-- AI 챗봇 -->
        <section id="view-chat" class="view" data-view="chat">
          <div id="chatMessages" class="chat-messages"></div>
          <div class="chat-composer">
            <div id="chatSuggestions" class="chip-row chat-suggestions"></div>
            <form id="chatForm" class="chat-form">
              <input id="chatInput" type="text" placeholder="예) 강남역 엘리베이터 돼?" autocomplete="off" />
              <button class="btn btn-primary" type="submit" aria-label="보내기"><span class="ms ms-lg" aria-hidden="true">arrow_upward</span></button>
            </form>
          </div>
        </section>
      </main>

      <!-- 바텀 시트 -->
      <div id="sheetBackdrop" class="sheet-backdrop"></div>
      <div id="bottomSheet" class="bottom-sheet" role="dialog" aria-modal="true">
        <button id="sheetHandle" class="sheet-handle" type="button" aria-label="시트 펼치기" aria-controls="sheetContent"></button>
        <div id="sheetContent" class="sheet-content"></div>
      </div>

      <!-- 하단 탭 -->
      <nav class="tab-bar">
        <button class="tab active" data-tab="map" type="button"><span class="tab-icon ms ms-lg" aria-hidden="true">map</span><span>노선도</span></button>
        <button class="tab" data-tab="elevator" type="button"><span class="tab-icon ms ms-lg" aria-hidden="true">elevator</span><span>엘리베이터</span></button>
        <button class="tab" data-tab="time" type="button"><span class="tab-icon ms ms-lg" aria-hidden="true">schedule</span><span>출발계산</span></button>
        <button class="tab" data-tab="chat" type="button"><span class="tab-icon ms ms-lg" aria-hidden="true">smart_toy</span><span>AI 챗봇</span></button>
      </nav>

      <div id="toast" class="toast"></div>
    </div>
  </div>

  <script src="js/mock-data.js"></script>
  <script src="js/elevator-service.js"></script>
  <script src="js/time-calculator.js"></script>
  <script src="js/metro-map.js"></script>
  <script src="js/ai-agent.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
